      item_selector: "div.card.job"
      title_selector: "h3.card-title a, h3.card-title"
      link_selector: "a.stretched-link, h3.card-title a, a[href]"
    notes: "Eigenes Jobboard stellen.center (nicht softgarden/rexx/Interamt). Anbieter im Impressum nicht weiter klassifiziert."

