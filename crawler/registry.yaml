# Registry der Ausschreibungsquellen
#
# Schema (pro Eintrag):
#   id:          stabiler Kurzschlüssel (slug)
#   name:        Anzeigename
#   ebene:       bund | land
#   land:        ISO-ähnlich / Name, nur bei ebene=land (sonst null)
#   type:        Adapter-Typ (interamt | successfactors | generic_html)
#   enabled:     false = überspringen
#   params:      adapter-spezifisch (siehe Kommentare unten)
#   notes:       Freitext / TODOs — keine Logik
#
# Adapter-Parameter:
#   interamt:
#     partner_id | integration_id  → öffentlicher webservice_v2-Feed
#     trefferliste_url              → HTML-Fallback
#   successfactors:
#     base_url, locale (default de_DE)
#   generic_html:
#     list_url, item_selector, title_selector?, link_selector?,
#     location_selector?, date_selector?, link_must_contain?, base_url?
#
# Ressortzuschnitt: Kabinett Merz (ab Mai 2025). Quellsysteme verifiziert Aug 2026.
# Partner-IDs nur eintragen, wenn am echten Embed/URL gesehen — nicht raten.

sources:
  # --- Interamt (öffentlicher Widget-Feed) ---------------------------------
  - id: bmwsb
    name: Bundesministerium für Wohnen, Stadtentwicklung und Bauwesen
    ebene: bund
    land: null
    type: interamt
    enabled: true
    params:
      partner_id: "4747"
      careers_url: https://www.bmwsb.bund.de/DE/ministerium/stellenangebote/stellenangebote_node.html
    notes: "Interamt-Integration/Widget ID 4747 auf der Ministeriumsseite verifiziert."

  # --- SuccessFactors RMK --------------------------------------------------
  - id: bmukn
    name: Bundesministerium für Umwelt, Klimaschutz, Naturschutz und nukleare Sicherheit
    ebene: bund
    land: null
    type: successfactors
    enabled: true
    params:
      base_url: https://jobs.bundesumweltministerium.de
      locale: de_DE
    notes: "SF RMK POST /services/recruiting/v1/jobs verifiziert. Altes Label BMUV auf karriere.bund.de."

  - id: bmv
