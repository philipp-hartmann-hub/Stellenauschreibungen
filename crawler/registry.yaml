    notes: "SF-Karriereseite von bmv.de verlinkt. Zum Prüfzeitpunkt 0 offene Stellen — Adapter bleibt aktiv."

  # --- Config-getriebenes HTML ---------------------------------------------
  - id: bmas
    name: Bundesministerium für Arbeit und Soziales
    ebene: bund
    land: null
