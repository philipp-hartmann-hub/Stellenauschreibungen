# Registry der Ausschreibungsquellen
#
# Schema (pro Eintrag):
#   id:          stabiler Kurzschlüssel (slug)
#   name:        Anzeigename
#   ebene:       bund | land
#   land:        ISO-ähnlich / Name, nur bei ebene=land (sonst null)
#   type:        Adapter-Typ (interamt | successfactors | generic_html | gjb | karriere_bw | karriere_bb | karriere_be | karriere_by | karriere_hb | karriere_he | karriere_mv | karriere_ni | karriere_nrw | karriere_sachsen | karriere_st | karriere_sh | karriere_th | karriere_rp)
#   enabled:     false = überspringen
#   params:      adapter-spezifisch (siehe Kommentare unten)
#   notes:       Freitext / TODOs — keine Logik
#
# Adapter-Parameter:
#   interamt:
#     partner_id | integration_id  → öffentlicher webservice_v2-Feed
#     trefferliste_url              → HTML-Fallback
#     behoerde_contains? | behoerde_equals? | behoerde_equals_any[]?
#       → Filter auf Feld Behoerde (exakt / Liste / Substring)
#     exclude_title_contains[]?    → Titel-Ausschluss (nachgeordnete Dienststellen)
#   successfactors:
#     base_url, locale (default de_DE)
#   generic_html:
#     list_url, item_selector, title_selector?, link_selector?,
#     location_selector?, date_selector?, link_must_contain?, base_url?
#   gjb:
#     api_base, portal_base?, search_path? (default search/jobs or search/ for hrxml),
#     search_format? (legacy | hrxml), organization_contains?,
#     parent_organization_contains?, parent_organization_needles[]?,
#     parent_organization_ids[]? (exakte ParentOrganization-ID, schließt Unterämter aus),
#     search_criterion?, page_size?, referer?, origin?
#   karriere_bw:
#     resort_id  → GET filter.resort auf karriere.baden-wuerttemberg.de/api/job-search
#   karriere_bb:
#     employer | employer_contains  → Filter auf GET karriere-in-brandenburg.de/api/offers
#     offer_type (default 92 = Stellenangebot)
#   karriere_be:
#     client_ids[]  → filter[client_id] auf karriereportal-stellen.berlin.de (Rexx)
#   karriere_by:
#     authority | authority_contains | authorities[]  → Filter auf tendering_authority_name (sei-dabay.de)
#   karriere_hb:
#     dienststelle_id  → POST dienststellen[] auf karriere.bremen.de (Session-Filter)
#   karriere_he:
#     department_name | department_names[]  → exakter Match auf Department/Name (SAP OData)
#     api_base?, portal_base?, page_size? (default 500)
#   karriere_mv:
#     employer_name | employer_names[]  → exakter Match auf Arbeitgeber in uebersicht/stelle
#     list_url?, base_url?
#   karriere_ni:
#     employer_name | employer_names[]  → exakter Match auf DienststelleBezeichnung (SearchStellen)
#     search_api?, portal_base?, graphql_node_id?, stellen_typ_id? (default 1)
#   karriere_nrw:
#     employer_name | employer_names[]  → exakter Match auf ausschreibende_behoerde
#       und dienststelle.benennung_dienststelle (nicht behoerde — schließt nachgeordnete
#       Dienststellen aus, die unter derselben Dienststellen-UUID laufen)
#     dienststelle_uuid?  → optionale Prüfung der Dienststellen-UUID
#     exclude_title_contains[]?  → Titel-Ausschluss (Polizeipräsidium, Bezirksregierung …)
#     api_url?, portal_base?, concurrency? (default 12), request_timeout? (default 60)
#   karriere_sachsen:
#     institution_id  → GET stellenanzeige?institutionId= (nur diese Institution,
#                       nicht der gesamte Geschäftsbereich / nachgeordnete Behörden)
#     api_url?, portal_base?, page_size? (default 100)
#   karriere_st:
#     employer_name | employer_names[]  → exakter Match auf Arbeitgeberzeile
#       in p.vacancy auf karriere.sachsen-anhalt.de/stellenangebote
#     exclude_title_contains[]?  → Titel-Ausschluss (Polizeivollzugsdienst …)
#     list_url?, base_url?
#   karriere_sh:
#     employer_name | employer_names[]  → exakter Match auf c-teaser-job__employer
#       in der zentralen Stellensuche schleswig-holstein.de
#     exclude_title_contains[]?  → Titel-Ausschluss (z. B. LKN.SH)
#     list_url?, form_url?, portal_base?, page_size? (default 100)
#   karriere_th:
#     employer_name | employer_names[]  → exakter Match auf company
#       in POST sft/job/search-job auf karriere.thueringen.de
#     exclude_title_contains[]?  → Titel-Ausschluss (Nationalpark, Schulamt …)
#     search_url?, portal_base?, request_timeout?
#   karriere_rp:
#     employer_name | employer_names[]  → exakter Match auf aufgelösten Arbeitgeber
#       (Einsatzdienststelle, sonst Ministeriumszeile in Bewerbungsadresse) auf
#       karriere.rlp.de/im-beruf Detailseiten
#     exclude_title_contains[]?  → Titel-Ausschluss
#     list_url?, portal_base?, concurrency? (default 8), request_timeout?
#
# Ressortzuschnitt Bund: Kabinett Merz (ab Mai 2025). Quellsysteme verifiziert Aug 2026.
# BW: resort_id aus /api/job-filter (Aug 2026, karriere.baden-wuerttemberg.de).
# BB: employer-Strings aus GET /api/offers (Aug 2026, karriere-in-brandenburg.de).
# BE: client_id aus Portal-Dropdown karriereportal-stellen.berlin.de (Aug 2026, Rexx).
# BY: authority-Strings aus POST job-postings.json (Aug 2026, sei-dabay.de / karriere.bayern.de).
# HB: dienststelle_id aus Portal-Checkbox karriere.bremen.de (Aug 2026).
# HH: GJB api-stellen.hamburg.de, search_format=hrxml, parent_organization_ids exakt (Aug 2026).
# HE: SAP OData zer_cand_unreg_srv auf stellensuche.hessen.de, department_name exakt (Aug 2026).
# MV: karriere-in-mv.de uebersicht/stelle, employer_name exakt (Aug 2026).
# NI: webservice.jobboerse.niedersachsen.de/data/SearchStellen, employer_name exakt (Aug 2026).
# SH: Stellensuche schleswig-holstein.de, employer_name exakt aus Facette AusschreibendeBehoerde (Aug 2026).
# TH: karriere.thueringen.de Craft-AJAX sft/job/search-job, company exakt (Aug 2026).
# RP: karriere.rlp.de/im-beruf Solr + Detail-DL, employer aus Einsatzdienststelle (Aug 2026).

