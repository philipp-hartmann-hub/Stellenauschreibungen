name: Daily crawl

on:
  schedule:
    # täglich 05:15 UTC
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crawler
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawler
        run: python crawler.py -v --db ../data/jobs.sqlite --json ../data/jobs.json --health ../data/health.json

      - name: Commit data
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.sqlite data/jobs.json data/health.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: update job data $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Health check
        working-directory: crawler
        env:
          GH_TOKEN: ${{ github.token }}
        run: python health.py ../data/health.json
